# KNOMI status helper for OctoPrint (also keeps Moonraker/Mainsail working)
#
# Use _KNOMI_SET wherever your config currently has
#   SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE=<flag> VALUE=True/False
# e.g.  _KNOMI_SET VAR=homing VALUE=1   ...   _KNOMI_SET VAR=homing VALUE=0
#
# It still sets the _KNOMI_STATUS variable (for Moonraker) and also prints
# "// KNOMI <flag>=<0|1>", which the OctoPrint-KNOMI plugin picks up. That is
# what makes homing/QGL/mesh inside PRINT_START show on the KNOMI.
# Flags: homing, probing, qgling, heating_nozzle, heating_bed,
#        shaping, pid_tuning, cleaning, filament, paused
#
# "paused" is also picked up automatically from PAUSE/RESUME, M600 and
# "// action:paused" / "// action:resumed" lines. For an MMU (ERCF/Happy Hare)
# pause that bypasses those, call _KNOMI_SET VAR=paused VALUE=1 in its pause hook.
#
# For Mainsail/Moonraker to see the four new flags, add them to your
# _KNOMI_STATUS macro too, e.g.  variable_shaping: False

[gcode_macro _KNOMI_SET]
description: Set a KNOMI status flag (Moonraker + OctoPrint)
gcode:
    {% set var = params.VAR|default("")|lower %}
    {% set value = 1 if params.VALUE|default(0)|string|lower in ("1", "true") else 0 %}
    {% if "gcode_macro _KNOMI_STATUS" in printer and var in printer["gcode_macro _KNOMI_STATUS"] %}
        SET_GCODE_VARIABLE MACRO=_KNOMI_STATUS VARIABLE={var} VALUE={"True" if value else "False"}
    {% endif %}
    {action_respond_info("KNOMI %s=%d" % (var, value))}
